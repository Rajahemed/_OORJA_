<!DOCTYPE html>
<html lang="en">
<head>
    
    <link rel="canonical" href="https://roadwarrior.pro/community.html" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Feed - OORJA</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; margin:0; padding:0; }
        .community-header { background: white; padding: 1.5rem; text-align: center; border-bottom: 1px solid var(--card-border); position: sticky; top:0; z-index:100; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .feed-container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .post-box { background: white; border: 1px solid var(--card-border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .post-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .author-info { flex: 1; }
        .author-name { font-weight: 700; color: var(--text-primary); margin:0; }
        .post-time { font-size: 0.8rem; color: var(--text-secondary); margin:0; }
        .post-content { color: var(--text-primary); line-height: 1.6; margin-bottom: 1rem; }
        .post-actions { display: flex; gap: 1.5rem; border-top: 1px solid var(--card-border); padding-top: 1rem; }
        .action-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; transition: color 0.2s; }
        .action-btn:hover { color: var(--primary-color); }
        .create-post { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; background: white; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--card-border); }
        .create-post textarea { border: 1px solid var(--card-border); border-radius: 8px; padding: 1rem; resize: none; width: 100%; outline: none; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
        .create-post button { align-self: flex-end; }
    </style>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1788318964507">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1788318964507">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1788318964507">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=1788318964507">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png?v=1788318964507">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=1788318964507">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png?v=1788318964507">

</head>
<body>

    <div class="community-header">
        <h1 style="margin:0; font-family:'Outfit', sans-serif;"><i class="fas fa-users text-primary-color"></i> Rider Community</h1>
        <p style="margin: 0.5rem 0 0 0; color:var(--text-secondary); font-size:0.9rem;">Share updates, ask questions, and connect with other EV riders.</p>
        <button class="btn btn-secondary btn-small" style="position:absolute; left:1rem; top:1.5rem;" onclick="window.history.back()"><i class="fas fa-arrow-left"></i> Back</button>
    </div>

    <div class="feed-container">
        
        <div class="create-post">
            <textarea id="postInput" rows="3" placeholder="What's on your mind? Found a good EV charging spot?"></textarea>
            <button class="btn btn-primary" onclick="createPost()">Post Update</button>
        </div>

        <div id="feedStream">
            <!-- Posts will be injected here -->
        </div>
        
    </div>

    <script>
        // Mock data initialization
        let posts = JSON.parse(localStorage.getItem('rw_community_posts') || '[]');
        if (posts.length === 0) {
            posts = [
                {
                    id: 1,
                    author: "Rakesh",
                    city: "Bengaluru",
                    content: "Just switched to EV today! The acceleration is insane and I saved ₹250 on petrol on day 1! ⚡🚀",
                    likes: 12,
                    time: "2 hours ago"
                },
                {
                    id: 2,
                    author: "Imran",
                    city: "Mumbai",
                    content: "Can anyone recommend a good fast charging station near Bandra? The usual one is crowded.",
                    likes: 5,
                    time: "5 hours ago"
                }
            ];
            localStorage.setItem('rw_community_posts', JSON.stringify(posts));
        }

        function renderPosts() {
            const stream = document.getElementById('feedStream');
            stream.innerHTML = '';
            posts.forEach(post => {
                const box = document.createElement('div');
                box.className = 'post-box';
                box.innerHTML = `
                    <div class="post-header">
                        <div class="avatar">${post.author.charAt(0)}</div>
                        <div class="author-info">
                            <p class="author-name">${post.author} <span style="font-size:0.8rem; font-weight:normal; color:#888;">• ${post.city}</span></p>
                            <p class="post-time">${post.time}</p>
                        </div>
                    </div>
                    <div class="post-content">
                        ${post.content}
                    </div>
                    <div class="post-actions">
                        <button class="action-btn" onclick="likePost(${post.id}, this)"><i class="far fa-heart"></i> <span>${post.likes}</span></button>
                        <button class="action-btn"><i class="far fa-comment"></i> Reply</button>
                    </div>
                `;
                stream.appendChild(box);
            });
        }

        function createPost() {
            const input = document.getElementById('postInput');
            const content = input.value.trim();
            if (!content) return;

            let currentUser = JSON.parse(localStorage.getItem('roadwarrior_current_user'));
            const authorName = currentUser ? currentUser.fullName : "Guest Rider";
            const authorCity = currentUser ? currentUser.city : "Unknown";

            const newPost = {
                id: Date.now(),
                author: authorName,
                city: authorCity,
                content: content,
                likes: 0,
                time: "Just now"
            };

            posts.unshift(newPost);
            localStorage.setItem('rw_community_posts', JSON.stringify(posts));
            input.value = '';
            renderPosts();
        }

        function likePost(id, btn) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.likes++;
                localStorage.setItem('rw_community_posts', JSON.stringify(posts));
                btn.innerHTML = `<i class="fas fa-heart" style="color:#ef4444;"></i> <span>${post.likes}</span>`;
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', renderPosts);
    </script>
</body>
</html>
