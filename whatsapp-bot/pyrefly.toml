# Pyrefly type checker configuration for Road Warrior WhatsApp Bot
# Suppresses errors for optional packages that may not be installed
# (google-generativeai, openai, supabase require Python < 3.14 to install)

[project]
# Tell Pyrefly where the source root is
include = ["services", "routers", "*.py"]

[errors]
# Suppress missing-import errors for optional third-party packages
# These packages are wrapped in try/except at runtime and are fully optional
ignore = ["missing-import"]
