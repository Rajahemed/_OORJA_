services:
  - type: web
    name: road-warrior-pro
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GTM_CONTAINER_ID
        sync: false
      - key: CLARITY_PROJECT_ID
        sync: false
      - key: GOOGLE_ADS_CONVERSION_ID
        sync: false
      - key: GOOGLE_ADS_REMARKETING_ID
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: LINKEDIN_INSIGHT_ID
        sync: false
      - key: TAWKTO_PROPERTY_ID
        sync: false
      - key: TIKTOK_PIXEL_ID
        sync: false
      - key: X_PIXEL_ID
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: VITE_HOTJAR_ID
        sync: false
      - key: VITE_SNAPCHAT_PIXEL
        sync: false
      - key: VITE_PINTEREST_TAG
        sync: false
      - key: VITE_MICROSOFT_UET
        sync: false
      - key: VITE_CALL_TRACKING_NUMBER
        sync: false
      - key: VITE_CALENDLY_URL
        sync: false
      - key: VITE_TELEGRAM_LINK
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
